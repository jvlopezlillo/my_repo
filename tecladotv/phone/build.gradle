plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.tecladotv.mando'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.tecladotv.mando'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
