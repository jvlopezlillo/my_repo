name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests y compilación
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :tvreceiver:testDebugUnitTest assembleRelease

      - name: Renombrar APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk CastBrowser.apk
          cp tvreceiver/build/outputs/apk/release/tvreceiver-release.apk CastBrowserTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CastBrowser-apk
          path: |
            CastBrowser.apk
            CastBrowserTV.apk

      - name: Publicar en Releases (descarga directa desde el móvil)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: castbrowser-latest
          name: CastBrowser (última versión)
          body: "**CastBrowser.apk** → el navegador, para el móvil. **CastBrowserTV.apk** → la app receptora, para la Android TV / Mi Box. Compilado desde ${{ github.ref_name }} (${{ github.sha }})."
          prerelease: false
          make_latest: true
          files: |
            CastBrowser.apk
            CastBrowserTV.apk
