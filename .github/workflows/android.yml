name: Android APK

on:
  push:
    branches: ['ccr-*', main, master]
    paths: ['android_app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-text-edit-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Publicar APK en una release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: PDF Text Edit (Android, última versión)
          prerelease: true
          files: android_app/build/app/outputs/flutter-apk/app-release.apk
