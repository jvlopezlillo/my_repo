name: Futmondo Android

on:
  push:
    paths: ["futmondo/**", ".github/workflows/futmondo-android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: futmondo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Pruebas de la lógica
        run: ./gradlew :core:test
      - name: APK de depuración
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: futmondo-debug-apk
          path: futmondo/app/build/outputs/apk/debug/app-debug.apk
