name: Futmondo Android

on:
  push:
    paths: ["futmondo/**", ".github/workflows/futmondo-android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: futmondo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restaurar clave de firma (si existen los secretos)
        env:
          KS_B64: ${{ secrets.FUTMONDO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/futmondo.jks"
            echo "FUTMONDO_KEYSTORE=$RUNNER_TEMP/futmondo.jks" >> "$GITHUB_ENV"
            echo "Clave de firma restaurada desde los secretos."
          else
            echo "::warning::Sin secretos de firma: el APK se firmará con una clave aleatoria y no podrá instalarse encima del anterior."
          fi
      - name: Pruebas de la lógica
        run: ./gradlew :core:test
      - name: APK de depuración
        env:
          FUTMONDO_KEYSTORE_PASSWORD: ${{ secrets.FUTMONDO_KEYSTORE_PASSWORD }}
          FUTMONDO_KEY_ALIAS: ${{ secrets.FUTMONDO_KEY_ALIAS }}
          FUTMONDO_KEY_PASSWORD: ${{ secrets.FUTMONDO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: futmondo-debug-apk
          path: futmondo/app/build/outputs/apk/debug/app-debug.apk
      - name: Huella de la firma (informativo; debe ser idéntica entre ejecuciones)
        continue-on-error: true
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"
