name: Teclado TV - compilar APKs

on:
  push:
    paths:
      - 'tecladotv/**'
      - '.github/workflows/tecladotv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tecladotv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Preparar APKs
        run: |
          mkdir -p ../apks
          cp tv/build/outputs/apk/release/tv-release.apk ../apks/TecladoTV-Receptor-para-MiBox.apk
          cp phone/build/outputs/apk/release/phone-release.apk ../apks/TecladoTV-Movil.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TecladoTV-apks
          path: apks/*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tecladotv-build-${{ github.run_number }}
          name: Teclado TV (compilación ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            - **TecladoTV-Receptor-para-MiBox.apk** → instalar en el Mi Box 3.
            - **TecladoTV-Movil.apk** → instalar en el móvil.
            Instrucciones: tecladotv/README.md
          files: apks/*.apk
          make_latest: true
